name: Build Termicro APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to repo root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Termicro.apk
          ls -lh Termicro.apk

      - name: Commit APK back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Termicro.apk
          git commit -m "Add Termicro.apk [skip ci]" || echo "nothing to commit"
          git push
